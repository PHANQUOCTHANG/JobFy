name: Security Audit

on:
  # Chạy hàng tuần vào thứ 2 lúc 8h sáng (giờ Việt Nam)
  schedule:
    - cron: '0 1 * * 1'  # 01:00 UTC = 08:00 ICT

  # Cho phép trigger thủ công
  workflow_dispatch:

  # Chạy khi có thay đổi package-lock.json
  push:
    branches:
      - main
    paths:
      - 'backend/package-lock.json'
      - 'frontend/package-lock.json'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: npm audit backend
  # ─────────────────────────────────────────────
  audit-backend:
    name: 🔒 Audit Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit
        # --audit-level=high: chỉ fail khi có lỗ hổng HIGH hoặc CRITICAL
        # --omit=dev: bỏ qua devDependencies (không deploy lên production)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

      - name: 📋 Audit report (full)
        if: always()
        run: npm audit --json --omit=dev > audit-backend.json || true

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-backend
          path: backend/audit-backend.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 2: npm audit frontend
  # ─────────────────────────────────────────────
  audit-frontend:
    name: 🔒 Audit Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

      - name: 📋 Audit report (full)
        if: always()
        run: npm audit --json --omit=dev > audit-frontend.json || true

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-frontend
          path: frontend/audit-frontend.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Tổng hợp kết quả
  # ─────────────────────────────────────────────
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    if: always()

    steps:
      - name: 📋 Write summary
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          BACKEND_STATUS="${{ needs.audit-backend.result }}"
          FRONTEND_STATUS="${{ needs.audit-frontend.result }}"
          
          if [ "$BACKEND_STATUS" = "success" ]; then
            echo "| 🔧 Backend | ✅ No high/critical vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔧 Backend | ❌ Vulnerabilities found – check artifact |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$FRONTEND_STATUS" = "success" ]; then
            echo "| 🎨 Frontend | ✅ No high/critical vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎨 Frontend | ❌ Vulnerabilities found – check artifact |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Audit reports (JSON) đã được upload dưới dạng workflow artifacts (lưu 30 ngày)." >> $GITHUB_STEP_SUMMARY
