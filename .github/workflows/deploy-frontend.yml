name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  # Cho phép trigger thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true  # Hủy deploy cũ nếu có push mới để tiết kiệm tài nguyên và tránh conflict

jobs:
  deploy-vercel:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để comment URL vào commit

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Type-check trước khi deploy
        working-directory: frontend
        run: npm run type-check

      - name: 🏗️ Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # ────────────────────────────────────────
      # Deploy lên Vercel
      # Cần thêm các secrets sau vào GitHub repo:
      #   VERCEL_TOKEN         → Vercel Dashboard > Account Settings > Tokens
      #   VERCEL_ORG_ID        → .vercel/project.json (sau khi chạy "vercel link")
      #   VERCEL_PROJECT_ID    → .vercel/project.json (sau khi chạy "vercel link")
      # ────────────────────────────────────────
      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🔗 Pull Vercel environment info
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build via Vercel CLI
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel (Production)
        id: deploy
        working-directory: frontend
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comment deployment URL on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const sha = context.sha.substring(0, 7);
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🚀 Frontend Production Deployed!\n\n| | |\n|---|---|\n| 🌐 **URL** | [${deploymentUrl}](${deploymentUrl}) |\n| 📦 **Commit** | \`${sha}\` |\n| 🕐 **Time** | ${new Date().toUTCString()} |`
            });

      - name: ✅ Deployment summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | ${{ steps.deploy.outputs.deployment_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY
