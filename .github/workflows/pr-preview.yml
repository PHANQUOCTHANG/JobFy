name: PR Preview (Vercel)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

concurrency:
  group: pr-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    name: 🔍 Deploy PR Preview
    runs-on: ubuntu-latest
    # Chỉ chạy nếu có VERCEL_TOKEN (tránh lỗi với fork PR)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    permissions:
      pull-requests: write  # Để comment URL preview lên PR

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🔗 Pull Vercel environment info
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build via Vercel CLI (preview)
        working-directory: frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy Preview
        id: deploy-preview
        working-directory: frontend
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comment Preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const previewUrl = '${{ steps.deploy-preview.outputs.preview_url }}';
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = `## 🔍 Frontend Preview Deployment

            | | |
            |---|---|
            | 🌐 **Preview URL** | [${previewUrl}](${previewUrl}) |
            | 📦 **Commit** | \`${sha}\` |
            | 🕐 **Deployed at** | ${new Date().toUTCString()} |

            > Preview sẽ tự động cập nhật khi bạn push thêm commits vào PR này.`;

            // Tìm comment cũ của bot để update thay vì tạo mới
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Frontend Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
