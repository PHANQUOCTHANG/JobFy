name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend – Type-check & Build
  # ─────────────────────────────────────────────
  backend-ci:
    name: 🔧 Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # Prisma generate cần DATABASE_URL để không bị lỗi ở môi trường CI
      - name: 🔑 Create dummy .env for Prisma
        run: |
          echo "DATABASE_URL=postgresql://ci_user:ci_pass@localhost:5432/ci_db?schema=public" > .env

      - name: 🔍 Type-check (TypeScript)
        run: npx tsc --noEmit

      - name: 🏗️ Build
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: Frontend – Lint, Type-check & Build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint (ESLint)
        run: npm run lint

      - name: 🔍 Type-check (TypeScript)
        run: npm run type-check

      - name: 🏗️ Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5000' }}
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 3: Docker Build Check (backend image)
  # ─────────────────────────────────────────────
  docker-build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    # Chỉ chạy khi push lên main hoặc develop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jobfy-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
