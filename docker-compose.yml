services:
  db:
    image: postgres:16-alpine
    container_name: jobfy_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobfy_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfy_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to connect to the local db container instead of the remote Neon DB
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Override REDIS_URL to use local Redis container instead of Upstash (for deployment use Upstash URL)
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      # Prevent local node_modules from overwriting container node_modules
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobfy_frontend
    ports:
      # Vite dev server runs on 5173
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Prevent local node_modules from overwriting container node_modules
      - /app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
