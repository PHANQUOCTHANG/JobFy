tags:
  name: Candidate Profiles
  description: Quản lý hồ sơ cá nhân của ứng viên

components:
  schemas:
    CandidateProfileRequestDto:
      type: object
      properties:
        fullName:
          type: string
          example: "Nguyễn Văn A"
        headline:
          type: string
          example: "Senior Frontend Developer"
        about:
          type: string
          example: "Hơn 5 năm kinh nghiệm làm việc với ReactJS, TypeScript..."
        phone:
          type: string
          example: "0987654321"
        address:
          type: string
          example: "123 Đường ABC, Quận 1, TP.HCM"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        birthDate:
          type: string
          format: date
          example: "1995-01-01"
        avatarUrl:
          type: string
          example: "https://example.com/avatar.jpg"
        isSearching:
          type: boolean
          example: true

paths:
  /api/v1/candidate-profiles/me:
    get:
      summary: Lấy hồ sơ cá nhân của ứng viên hiện tại
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
    post:
      summary: Tạo mới hồ sơ cá nhân (Dành cho ứng viên)
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileRequestDto'
      responses:
        201:
          description: Tạo thành công
    patch:
      summary: Cập nhật hồ sơ cá nhân (Dành cho ứng viên)
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileRequestDto'
      responses:
        200:
          description: Cập nhật thành công

  /api/v1/candidate-profiles:
    get:
      summary: Lấy danh sách hồ sơ ứng viên (Công khai)
      tags: [Candidate Profiles]
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: Thành công

  /api/v1/candidate-profiles/admin:
    get:
      summary: Lấy danh sách hồ sơ ứng viên (Admin)
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: Thành công

  /api/v1/candidate-profiles/{id}:
    get:
      summary: Lấy chi tiết hồ sơ ứng viên
      tags: [Candidate Profiles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công

  /api/v1/candidate-profiles/{id}/admin:
    patch:
      summary: Cập nhật hồ sơ ứng viên (Admin)
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileRequestDto'
      responses:
        200:
          description: Thành công
    delete:
      summary: Xóa hồ sơ ứng viên (Admin)
      tags: [Candidate Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
