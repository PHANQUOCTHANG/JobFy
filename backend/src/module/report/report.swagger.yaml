tags:
  name: Reports
  description: Quản lý Báo cáo vi phạm

components:
  schemas:
    CreateReportRequestDto:
      type: object
      required:
        - targetType
        - targetId
        - reason
        - description
      properties:
        targetType:
          type: string
          enum: [job, company, review, user]
          example: "job"
        targetId:
          type: string
          example: "uuid-target"
        reason:
          type: string
          example: "Tin tuyển dụng lừa đảo"
        description:
          type: string
          example: "Công ty yêu cầu đóng phí trước khi làm việc..."

paths:
  /api/v1/reports:
    get:
      summary: Lấy danh sách báo cáo (Admin)
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: status
          schema:
            type: string
      responses:
        200:
          description: Thành công
    post:
      summary: Gửi báo cáo vi phạm
      tags: [Reports]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequestDto'
      responses:
        201:
          description: Gửi thành công

  /api/v1/reports/{id}/review:
    patch:
      summary: Xử lý báo cáo (Admin)
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, resolved, dismissed]
                  example: "resolved"
                adminNote:
                  type: string
                  example: "Đã gỡ bài đăng"
      responses:
        200:
          description: Thành công
