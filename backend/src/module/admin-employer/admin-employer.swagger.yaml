tags:
  - name: Admin Employer
    description: API dành cho quản trị viên duyệt và quản lý hồ sơ doanh nghiệp.

paths:
  /api/v1/admin/employer/pending:
    get:
      tags: [Admin Employer]
      summary: Danh sách hồ sơ chờ duyệt
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        200:
          description: Trả về danh sách công ty kèm thông tin phân trang.

  /api/v1/admin/employer/{companyId}:
    get:
      tags: [Admin Employer]
      summary: Xem chi tiết hồ sơ công ty
      description: Lấy toàn bộ thông tin công ty và tài liệu pháp lý để review.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Chi tiết hồ sơ.
        404:
          description: Không tìm thấy công ty.

  /api/v1/admin/employer/{companyId}/verify:
    patch:
      tags: [Admin Employer]
      summary: Phê duyệt hoặc từ chối hồ sơ
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCompanyRequest'
      responses:
        200:
          description: Cập nhật trạng thái thành công.
        400:
          description: Dữ liệu trạng thái không hợp lệ.

components:
  schemas:
    VerifyCompanyRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
          example: approved
        reason:
          type: string
          description: Lý do từ chối (bắt buộc nếu status là rejected)
          example: "Giấy phép kinh doanh đã hết hạn hoặc mờ không đọc được."

    ErrorResponse:
      type: object
      properties:
        status: { type: string, example: fail }
        message: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT