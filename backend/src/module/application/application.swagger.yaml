tags:
  name: Applications
  description: Quản lý Hồ sơ Ứng tuyển (Applications)

components:
  schemas:
    CreateApplicationRequestDto:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          example: "uuid-job-id"
        resumeId:
          type: string
          example: "uuid-resume-id"
        coverLetterId:
          type: string
          example: "uuid-cover-letter-id"
        coverLetterContent:
          type: string
          example: "Tôi rất mong muốn được làm việc tại công ty..."

    UpdateApplicationStatusRequestDto:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, reviewing, interviewed, offered, rejected, hired]
          example: "reviewing"
        note:
          type: string
          example: "Ứng viên rất tiềm năng"

    CreateApplicationNoteRequestDto:
      type: object
      required:
        - note
      properties:
        note:
          type: string
          example: "Gọi điện thoại vào lúc 10h sáng"

paths:
  /api/v1/applications:
    get:
      summary: Lấy danh sách hồ sơ ứng tuyển
      tags: [Applications]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: status
          schema:
            type: string
      responses:
        200:
          description: Thành công
    post:
      summary: Ứng tuyển công việc bằng CV có sẵn (Candidate)
      tags: [Applications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequestDto'
      responses:
        201:
          description: Ứng tuyển thành công

  /api/v1/applications/upload-cv:
    post:
      summary: Ứng tuyển bằng cách tải file CV lên (Candidate)
      tags: [Applications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                jobId:
                  type: string
                coverLetterContent:
                  type: string
      responses:
        201:
          description: Ứng tuyển thành công

  /api/v1/applications/{id}:
    get:
      summary: Lấy chi tiết hồ sơ ứng tuyển
      tags: [Applications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công

  /api/v1/applications/{id}/status:
    patch:
      summary: Cập nhật trạng thái hồ sơ ứng tuyển (Employer)
      tags: [Applications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequestDto'
      responses:
        200:
          description: Cập nhật thành công

  /api/v1/applications/{id}/notes:
    post:
      summary: Thêm ghi chú vào hồ sơ ứng tuyển (Employer)
      tags: [Applications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationNoteRequestDto'
      responses:
        201:
          description: Thêm ghi chú thành công
