tags:
  name: Saved Jobs
  description: Quản lý Việc làm đã lưu của ứng viên

paths:
  /api/v1/saved-jobs:
    get:
      summary: Lấy danh sách việc làm đã lưu
      tags: [Saved Jobs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
      responses:
        200:
          description: Thành công

  /api/v1/saved-jobs/ids:
    get:
      summary: Lấy danh sách ID việc làm đã lưu
      tags: [Saved Jobs]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /api/v1/saved-jobs/{jobId}:
    post:
      summary: Lưu việc làm
      tags: [Saved Jobs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        201:
          description: Lưu thành công
    delete:
      summary: Bỏ lưu việc làm
      tags: [Saved Jobs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  /api/v1/saved-jobs/{jobId}/check:
    get:
      summary: Kiểm tra việc làm đã lưu chưa
      tags: [Saved Jobs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
