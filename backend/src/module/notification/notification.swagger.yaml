tags:
  name: Notifications
  description: Quản lý Thông báo hệ thống

paths:
  /api/v1/notifications:
    get:
      summary: Lấy danh sách thông báo
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: number
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: isRead
          schema:
            type: boolean
      responses:
        200:
          description: Thành công

  /api/v1/notifications/unread-count:
    get:
      summary: Lấy số lượng thông báo chưa đọc
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /api/v1/notifications/read-all:
    patch:
      summary: Đánh dấu tất cả là đã đọc
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /api/v1/notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công

  /api/v1/notifications/{id}:
    delete:
      summary: Xóa thông báo
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
