# docker-compose.production.yml
# Dùng cho môi trường production trên VPS
# Chạy: docker compose -f docker-compose.production.yml up -d
#
# Yêu cầu file .env ở root có các biến:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   (backend dùng biến từ backend/.env)

services:
  db:
    image: postgres:16-alpine
    container_name: jobfy_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không expose port ra ngoài trong production
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - jobfy-internal

  redis:
    image: redis:7-alpine
    container_name: jobfy_redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - jobfy-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: jobfy-backend:latest
    container_name: jobfy_backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - jobfy-internal
      - jobfy-external
    # Giới hạn tài nguyên
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  # Internal: chỉ các service trong compose giao tiếp với nhau
  jobfy-internal:
    internal: true
  # External: backend expose ra ngoài (Nginx/proxy)
  jobfy-external:
    driver: bridge
